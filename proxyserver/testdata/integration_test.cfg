{
  "discovery": {
    "discoveryMode": "static",
    "listedTools": ["*"],
    "servers": [
      { "serverName": "mcp1", "serverUrl": "http://localhost:8082/mcp" },
      { "serverName": "mcp2", "serverUrl": "http://localhost:8083/mcp" }
    ]
  },
  "roleMapping": { "administrator": "admin" },
  "accessRules": {
    "clientAccessRules": [
      {
        "role": "admin",
        "allowed_tools": ["*"],
        "allowed_prompts": ["*"],
        "allowed_resources": ["*"],
        "allowed_resource_templates": ["*"]
      },
      {
        "role": "finance",
        "allowed_tools": ["analytics_transactions", "audit_transactions"],
        "allowed_prompts": [],
        "allowed_resources": [],
        "allowed_resource_templates": []
      },
      {
        "role": "development.*",
        "allowed_tools": ["analytics_*", "audit_*"],
        "allowed_prompts": ["mcp1.dev_*"],
        "allowed_resources": ["mcp1:file:///dev-*"],
        "allowed_resource_templates": ["mcp1:file:///*"]
      },
      {
        "role": "development.manager",
        "allowed_tools": ["meta_*"],
        "allowed_prompts": ["meta_*"],
        "allowed_resources": ["meta_*"],
        "allowed_resource_templates": ["meta_*"]
      },
      {
        "role": "*",
        "allowed_tools": ["proxy_utility.call_tool", "proxy_utility.get_my_id_details", "proxy_utility.get_prompts", "proxy_utility.render_prompt", "proxy_utility.find_relevant_tools"],
        "allowed_prompts": [],
        "allowed_resources": [],
        "allowed_resource_templates": []
      }
    ]
  },
  "auth": {
    "publicKeyPath": "./public.pem",
    "jwksUrl": "",
    "issuer": "",
    "audience": ""
  },
  "governanceOrchestration": {
    "orchestrations": {
      "standard-guardrails": {
        "callAuthorization": [
          { "server": "authorization-mcp-server", "tool": "call-authorization" },
          { "server": "authorization-mcp-server", "tool": "call-authorization-role-check" }
        ],
        "resultAuthorization": [
          { "server": "authorization-mcp-server", "tool": "result-authorization" },
          { "server": "authorization-mcp-server", "tool": "result-authorization-length-check" }
        ],
        "toolCallAudit": ["publish-tool-request-result"]
      }
    },
    "toolMappings": [
      { "pattern": "orchestration-demo.*", "orchestration": "standard-guardrails" }
    ]
  },
  "eventDictionary": {
    "eventTypes": {}
  },
  "declarativeGuardrails": {
    "actions": ["block", "alert", "log"],
    "declarations": [
      {
        "name": "no-dollar-sums",
        "constraint": "Dollar amounts or currency sums must not appear.",
        "roleExpression": "manager & developer",
        "actions": ["block", "alert"]
      },
      {
        "name": "guest-warning",
        "constraint": "No customer, financial, or otherwise non-public data.",
        "roleExpression": "guest",
        "actions": ["log"]
      },
      {
        "name": "business-hours-only",
        "constraint": "Changes to production configuration must not be made; only read-only actions are permitted.",
        "roleExpression": "_any_role",
        "actions": ["alert"],
        "timezone": "EST",
        "effectiveTime": [
          {"days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "startTime": "09:00", "endTime": "17:00"}
        ]
      },
      {
        "name": "admin-override",
        "roleExpression": "(admin | superuser) & !suspended",
        "actions": ["log"]
      },
      {
        "name": "weekend-alert",
        "constraint": "Bulk data export or large-scale deletion actions must not be initiated.",
        "roleExpression": "_any_role",
        "actions": ["alert"],
        "timezone": "EST",
        "effectiveTime": [
          {"days": ["Saturday", "Sunday"], "startTime": "00:00", "endTime": "23:59"}
        ]
      },
      {
        "name": "compliance-freeze",
        "constraint": "No modification to production financial systems, including schema changes, credential rotations, configuration updates, or data migrations.",
        "roleExpression": "_any_role",
        "actions": ["block"],
        "timezone": "EST",
        "effectiveDate": {"start": "2026-12-01", "end": "2026-12-31"}
      },
      {
        "name": "legal-hold",
        "constraint": "No deletion of any record, file, or data.",
        "roleExpression": "!legal & delete-permission",
        "actions": ["block", "log"],
        "timezone": "EST",
        "effectiveDate": {"start": "2026-03-01"}
      },
      {
        "name": "dollar-limit-manager-only",
        "constraint": "Dollar-amount approvals above the configured threshold must include an explicit justification before being granted.",
        "roleExpression": "manager & !guest",
        "actions": ["alert"]
      },
      {
        "name": "cross-team-review",
        "constraint": "No request that combines financial account data with legal case information may be approved.",
        "roleExpression": "(finance | legal) & (manager | director) & !external",
        "actions": ["alert", "log"]
      },
      {
        "name": "after-hours-alert",
        "constraint": "Requests to access production credentials or secrets must not be permitted.",
        "roleExpression": "_any_role",
        "actions": ["alert"],
        "timezone": "EST",
        "effectiveTime": [
          {"days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "startTime": "17:00", "endTime": "23:59"},
          {"days": ["Saturday", "Sunday"], "startTime": "00:00", "endTime": "23:59"}
        ]
      },
      {
        "name": "new-employee-restriction",
        "constraint": "No access to customer payment information, billing history, or account deletion actions.",
        "roleExpression": "new-hire & !manager",
        "actions": ["block", "log"]
      },
      {
        "name": "multi-role-any",
        "constraint": "References to unreleased product names or features must not appear.",
        "roleExpression": "_any_role",
        "actions": ["log"],
        "timezone": "EST",
        "effectiveDate": {"start": "2026-06-01"}
      },
      {
        "name": "sensitive-data-access",
        "constraint": "Social security numbers, dates of birth, full payment card numbers, bank account or routing numbers, driver's license numbers, passport numbers, or any other directly identifying personal data must not appear.",
        "roleExpression": "(data-officer | (manager & security-cleared)) & !contractor",
        "actions": ["block", "alert"]
      },
      {
        "name": "year-end-freeze",
        "constraint": "Configuration changes to production deployment pipelines must not be made.",
        "roleExpression": "_any_role",
        "actions": ["block"],
        "timezone": "EST",
        "effectiveDate": {"end": "2026-12-31"}
      },
      {
        "name": "vendor-access-block",
        "roleExpression": "vendor | contractor",
        "actions": ["block"]
      }
    ]
  },
  "logLevel": { "level": "info" }
}

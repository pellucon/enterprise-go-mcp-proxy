{
  "discovery": {
    "discoveryMode": "static",
    "listedTools": ["*"],
    "servers": [
      { "serverName": "orchestration-demo", "serverUrl": "http://localhost:8092/mcp" },
      { "serverName": "authorization-mcp-server", "serverUrl": "http://localhost:8093/mcp" },
      { "serverName": "declarative-guardrail", "serverUrl": "http://localhost:8094/mcp" },
      { "serverName": "ai-powered-tools", "serverUrl": "http://localhost:8116/mcp" },
      { "serverName": "rate-limiter", "serverUrl": "http://localhost:8117/mcp" }
    ]
  },
  "roleMapping": { "administrator": "admin" },
  "accessRules": {
    "clientAccessRules": [
      { "role": "admin", "allowed_tools": ["*"], "allowed_prompts": ["*"], "allowed_resources": ["*"], "allowed_resource_templates": ["*"] },
      { "role": "guest", "allowed_tools": ["orchestration-demo.*"], "allowed_prompts": [], "allowed_resources": [], "allowed_resource_templates": [] },
      { "role": "*", "allowed_tools": ["proxy_utility.call_tool", "proxy_utility.get_my_id_details", "proxy_utility.get_prompts", "proxy_utility.render_prompt", "proxy_utility.find_relevant_tools"], "allowed_prompts": [], "allowed_resources": [], "allowed_resource_templates": [] }
    ]
  },
  "auth": {
    "publicKeyPath": "./public.pem",
    "jwksUrl": "",
    "issuer": "",
    "audience": ""
  },
  "internalAuth": {
    "issuer": "go-proxy",
    "audience": "go-proxy-backend",
    "ttlSeconds": 60,
    "relay": {
      "orchestration-demo": ["orchestration-demo.say_hello"]
    }
  },
  "selfUrl": "http://localhost:8091/mcp",
  "governanceOrchestration": {
    "orchestrations": {
      "standard-guardrails": {
        "callAuthorization": [
          { "server": "authorization-mcp-server", "tool": "call-authorization" },
          { "server": "authorization-mcp-server", "tool": "call-authorization-role-check", "parameters": "{\"minRole\":\"user\",\"team\":\"platform-security\"}" }
        ],
        "resultAuthorization": [
          { "server": "authorization-mcp-server", "tool": "result-authorization" },
          { "server": "authorization-mcp-server", "tool": "result-authorization-length-check", "parameters": "{\"maxLength\":50,\"team\":\"platform-security\"}" }
        ],
        "toolCallAudit": ["publish-tool-request-result", "publish-tool-request"]
      },
      "declarative-constraint-guardrails": {
        "callAuthorization": [
          { "server": "proxy_utility", "tool": "request_constraints_validation", "parameters": "{\"declarationNames\":[\"amount-limit\"]}" }
        ],
        "resultAuthorization": [
          { "server": "proxy_utility", "tool": "result_constraints_validation", "parameters": "{\"declarationNames\":[\"result-amount-limit\"]}" }
        ],
        "toolCallAudit": ["publish-tool-request-result"]
      },
      "ai-declarative-constraint-guardrails": {
        "resultAuthorization": [
          { "server": "proxy_utility", "tool": "result_ai_constraints_validation", "parameters": "{\"declarationNames\":[\"result-no-ssn-disclosure\"]}" }
        ],
        "toolCallAudit": ["publish-tool-request-result"]
      },
      "business-constraint-guardrails": {
        "callAuthorization": [
          { "server": "proxy_utility", "tool": "business_logic_constraints_validation", "parameters": "{\"declarationNames\":[\"budget-limit\"]}" }
        ],
        "toolCallAudit": ["publish-tool-request-result"]
      }
    },
    "toolMappings": [
      { "pattern": "orchestration-demo.amount_tool", "orchestration": "declarative-constraint-guardrails" },
      { "pattern": "orchestration-demo.disclosure_tool", "orchestration": "ai-declarative-constraint-guardrails" },
      { "pattern": "orchestration-demo.budget_tool", "orchestration": "business-constraint-guardrails" },
      { "pattern": "orchestration-demo.*", "orchestration": "standard-guardrails" }
    ]
  },
  "eventDictionary": {
    "eventTypes": {
      "alert": {
        "subtypes": ["tool-call-blocked", "result-blocked", "tool-call-alert", "result-alert"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "reason": { "type": "string", "required": true },
          "toolCallId": { "type": "string", "required": true }
        }
      },
      "tool-request": {
        "subtypes": ["request-blocked", "request-ok"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "request": { "type": "json", "required": true },
          "reason": { "type": "string", "required": false },
          "toolCallId": { "type": "string", "required": true }
        }
      },
      "tool-request-result": {
        "subtypes": ["result-blocked", "call-failed", "call-succeeded"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "request": { "type": "json", "required": true },
          "result": { "type": "json", "required": false },
          "reason": { "type": "string", "required": false },
          "toolCallId": { "type": "string", "required": true }
        }
      }
    }
  },
  "rateLimiting": {
    "timeoutSeconds": 1,
    "tools": {
      "orchestration-demo.rate_limited_tool": { "globalPerMinute": 1 },
      "orchestration-demo.validate_budget_tool": { "globalPerMinute": 1 }
    }
  },
  "declarativeGuardrails": {
    "actions": ["block", "alert", "log"],
    "declarations": [
      {
        "name": "amount-limit",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"amount\":{\"type\":\"number\",\"maximum\":1000}}}}}",
        "roleExpression": "_any_role",
        "actions": ["block", "alert"]
      },
      {
        "name": "result-amount-limit",
        "constraint": "{\"type\":\"object\",\"properties\":{\"structuredContent\":{\"type\":\"object\",\"properties\":{\"total\":{\"type\":\"number\",\"maximum\":1000}}}}}",
        "roleExpression": "_any_role",
        "actions": ["block", "alert"]
      },
      {
        "name": "result-no-ssn-disclosure",
        "constraint": "The result must not disclose any customer's Social Security Number or other government ID number.",
        "roleExpression": "_any_role",
        "actions": ["block", "alert"]
      },
      {
        "name": "budget-limit",
        "constraint": "{\"validationTool\": \"validate_budget_tool\", \"parameters\": {\"maxAmount\": 1000}}",
        "roleExpression": "_any_role",
        "actions": ["block", "alert"]
      }
    ]
  },
  "logLevel": { "level": "info" }
}

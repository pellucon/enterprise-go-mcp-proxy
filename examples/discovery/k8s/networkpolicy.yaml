# Backends must be reachable only through go-proxy. Deny all ingress in this
# namespace, then allow go-proxy's pods (in the mcp-proxy namespace) to reach
# the hello-world server — the same pattern as
# go-gardening-demo/k8s/networkpolicy-allow-ingress-from-proxy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-proxy
spec:
  podSelector:
    matchLabels:
      mcp.io/role: backend-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-proxy
          podSelector:
            matchLabels:
              app: go-proxy
      ports:
        - protocol: TCP
          port: 8080

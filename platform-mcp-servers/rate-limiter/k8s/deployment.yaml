apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  labels:
    app: rate-limiter
spec:
  # Single pod only: the Limiter's per-tool decay state and the stats
  # recorder are both in-process memory with no cross-replica coordination
  # (no NATS/shared-store sync) -- a second replica would enforce/report
  # independently-wrong numbers instead of sharing one consistent view.
  replicas: 1
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
        mcp.io/role: backend-mcp-server
    spec:
      # Backend MCP servers never need k8s API access; only go-proxy does.
      automountServiceAccountToken: false
      containers:
        - name: rate-limiter
          image: rate-limiter:local
          imagePullPolicy: IfNotPresent
          args:
            - -port=:8080
            - -config=/app-run/config.json
            - -nats-url=nats://nats:4222
            - -log-level-config=/app-run/log-level/config.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
          env:
            - name: NATS_CREDENTIALS_DIR
              value: /etc/nats-client
          volumeMounts:
            - name: nats-client
              mountPath: /etc/nats-client
              readOnly: true
            - name: rate-limiting-override
              mountPath: /app-run
              readOnly: true
            - name: log-level-override
              mountPath: /app-run/log-level
              readOnly: true
      volumes:
        # This component's own NATS credentials and the CA for NATS's TLS
        # certificate (scripts/deploy.sh's ensure_nats_secrets; see
        # k8s/nats/nats.conf.tmpl for what this user may do).
        - name: nats-client
          secret:
            secretName: nats-client-rate-limiter
        - name: rate-limiting-override
          configMap:
            name: rate-limiting-override
        - name: log-level-override
          configMap:
            name: log-level-override
            optional: true

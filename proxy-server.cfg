{
  "discovery": {
    "discoveryMode": "k8s",
    "listedTools": ["*"],
    "frequencySeconds": 2,
    "toolsPollFrequencySeconds": 5,
    "promptsPollFrequencySeconds": 5,
    "resourcesPollFrequencySeconds": 5,
    "resourceTemplatesPollFrequencySeconds": 5,
    "k8sLabelSelector": "mcp.io/role=backend-mcp-server",
    "k8sNamespaces": ["mcp-proxy", "gardening-demo"],
    "k8sPinnedServers": {
      "rate-limiter": "mcp-proxy/rate-limiter",
      "declarative-guardrail": "mcp-proxy/declarative-guardrail",
      "event-aggregator": "mcp-proxy/event-aggregator",
      "ai-powered-tools": "mcp-proxy/ai-powered-tools",
      "garden-business-ops": "gardening-demo/garden-business-ops",
      "garden-customer-admin": "gardening-demo/garden-customer-admin",
      "garden-customer-service": "gardening-demo/garden-customer-service",
      "garden-online-store": "gardening-demo/garden-online-store",
      "garden-staff-admin": "gardening-demo/garden-staff-admin"
    }
  },
  "roleMapping": { "administrator": "admin" },
  "accessRules": {
    "clientAccessRules": [
      {
        "role": "admin",
        "allowed_tools": ["*"],
        "allowed_prompts": ["*"],
        "allowed_resources": ["*"],
        "allowed_resource_templates": ["*"]
      },
      {
        "role": "*",
        "allowed_tools": ["proxy_utility.call_tool", "proxy_utility.get_my_id_details", "proxy_utility.get_prompts", "proxy_utility.render_prompt", "proxy_utility.find_relevant_tools"],
        "allowed_prompts": [],
        "allowed_resources": [],
        "allowed_resource_templates": []
      }
    ]
  },
  "auth": {
    "publicKeyPath": "",
    "jwksUrl": "http://demo-authorization-server.demo-auth.svc.cluster.local:8102/.well-known/jwks.json",
    "issuer": "http://localhost:8102",
    "audience": "go-proxy",
    "roleClaim": "app_roles",
    "resourceUrl": "http://localhost/mcp"
  },
  "internalAuth": {
    "issuer": "go-proxy",
    "audience": "go-proxy-backend",
    "ttlSeconds": 60,
    "maxRelayHops": 3,
    "relay": {
      "garden-business-ops": ["garden-customer-admin.modify_customer_type"],
      "garden-customer-service": ["garden-customer-admin.modify_customer_sentiment"],
      "garden-online-store": ["garden-customer-admin.get_customer_type", "garden-business-ops.get_active_deals"],
      "garden-staff-admin": ["garden-customer-service.get_customer_service_calls"]
    }
  },
  "governanceOrchestration": {
    "orchestrations": {
      "catch-all": {
        "toolCallAudit": ["publish-tool-request-result"]
      }
    },
    "toolMappings": [
      { "pattern": "*", "orchestration": "catch-all" }
    ]
  },
  "eventDictionary": {
    "eventTypes": {
      "alert": {
        "subtypes": ["tool-call-blocked", "result-blocked", "tool-call-alert", "result-alert"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "reason": { "type": "string", "required": true },
          "toolCallId": { "type": "string", "required": true }
        }
      },
      "tool-request": {
        "subtypes": ["request-blocked", "request-ok"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "request": { "type": "json", "required": true },
          "reason": { "type": "string", "required": false },
          "toolCallId": { "type": "string", "required": true }
        }
      },
      "tool-request-result": {
        "subtypes": ["result-blocked", "call-failed", "call-succeeded"],
        "metadata": {
          "user": { "type": "string", "required": true },
          "roles": { "type": "json", "required": true },
          "tool": { "type": "string", "required": true },
          "request": { "type": "json", "required": true },
          "result": { "type": "json", "required": false },
          "reason": { "type": "string", "required": false },
          "toolCallId": { "type": "string", "required": true }
        }
      }
    }
  },
  "declarativeGuardrails": {
    "actions": ["block", "alert", "log"],
    "declarations": []
  },
  "eventAggregation": {
    "filter": {},
    "maxBufferSize": 1000,
    "maxLogAgeDays": 5,
    "maxLogSizeBytes": 10000000,
    "archiverTransport": { "type": "discard" }
  },
  "rateLimiting": {},
  "logLevel": { "level": "info" },
  "selfUrl": "http://go-proxy.mcp-proxy.svc.cluster.local/mcp",
  "natsUrl": "nats://nats:4222"
}

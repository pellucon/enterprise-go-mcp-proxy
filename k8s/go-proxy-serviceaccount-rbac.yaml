apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-proxy-k8s-access
rules:
  # Least privilege: go-proxy may touch only the objects it owns, by name.
  # Everything else in its namespace - its own startup config
  # (proxy-server-config: auth, roleMapping, internalAuth), the NATS
  # config and passwords, the image pull secret, other components'
  # ConfigMaps - it can't read or change, so a compromised go-proxy can't
  # either. go-proxy reads proxy-server-config as a mounted file and needs
  # no API access to it; only deploy.sh, with the operator's own
  # credentials, writes it.
  #
  # configsync (configsync/writer.go): get/update each "<section>-override"
  # ConfigMap behind an _admin.update_<section>/export_<section> pair. A
  # new configsync section must be added here. go-proxy never lists or
  # watches ConfigMaps (its Watchers read mounted files).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
    resourceNames:
      - access-rules-override
      - orchestration-override
      - discovery-override
      - event-dictionary-override
      - declarative-guardrails-override
      - event-aggregation-override
      - rate-limiting-override
      - log-level-override
  # bootstrapInternalSigningKey (internal_signing_key.go): read the
  # go-proxy-internal-signing-key Secret every replica signs with. Never
  # update/delete/list/watch: a key already in the Secret is never
  # rewritten.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["go-proxy-internal-signing-key"]
  # Creating the first override ConfigMaps (configsync's seed) and the
  # signing-key Secret. RBAC can't limit create by name. Creating an object
  # gives no access to existing ones, and get above is by name only, so
  # go-proxy can't read back anything else it creates either (e.g. a
  # service-account token Secret).
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create"]
  # Backend credentials Secrets (backendauth): not granted here. deploy.sh
  # (apply_credentials_rbac) grants get on exactly the Secrets the live
  # discovery config names, as the go-proxy-credentials Role.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-proxy-k8s-access
subjects:
  - kind: ServiceAccount
    name: go-proxy
    namespace: mcp-proxy
roleRef:
  kind: Role
  name: go-proxy-k8s-access
  apiGroup: rbac.authorization.k8s.io
# Backend MCP server discovery's Service access is NOT granted here: it's
# a namespaced Role per trusted namespace, k8s/discovery/go-proxy-discovery-rbac.yaml,
# applied by scripts/deploy.sh into each namespace the cfg's
# discovery.k8sNamespaces lists. go-proxy has no cluster-wide permissions.

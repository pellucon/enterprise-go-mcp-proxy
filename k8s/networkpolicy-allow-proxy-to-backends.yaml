apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-backends
spec:
  # Selects every backend MCP server pod (customer-service, company-service,
  # and any future one carrying this label) and allows ingress only from
  # pods labeled app: go-proxy. This is the enforcement mechanism for
  # requirement 2: backends are unreachable except through the proxy.
  podSelector:
    matchLabels:
      mcp.io/role: backend-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: go-proxy
      ports:
        - protocol: TCP
          port: 8080

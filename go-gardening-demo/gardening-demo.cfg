{
  "roleMapping": {
    "administrator": "admin"
  },
  "accessRules": {
    "clientAccessRules": [
      {
        "role": "*",
        "allowed_tools": [
          "proxy_utility.call_tool",
          "proxy_utility.get_my_id_details",
          "proxy_utility.get_prompts",
          "proxy_utility.render_prompt",
          "proxy_utility.find_relevant_tools"
        ]
      },
      {
        "role": "admin",
        "allowed_tools": [
          "*"
        ],
        "allowed_prompts": [
          "*"
        ],
        "allowed_resources": [
          "*"
        ],
        "allowed_resource_templates": [
          "*"
        ]
      },
      {
        "role": "business-manager",
        "allowed_tools": [
          "garden-customer-admin.*",
          "garden-business-ops.*",
          "garden-online-store.load_customer_orders",
          "garden-online-store.purchase_fulfilled",
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.load_historical_purchases",
          "garden-online-store.add_product_supply",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "event-aggregator.list_events"
        ],
        "allowed_prompts": [
          "garden-business-ops.unauthorized_requests_report",
          "garden-business-ops.unavailable_and_unpopular_products"
        ]
      },
      {
        "role": "human_resource_manager",
        "allowed_tools": [
          "garden-staff-admin.*",
          "garden-customer-service.get_customer_service_calls"
        ]
      },
      {
        "role": "customer-support-manager",
        "allowed_tools": [
          "garden-customer-service.*"
        ]
      },
      {
        "role": "customer-management",
        "allowed_tools": [
          "garden-customer-admin.*"
        ]
      },
      {
        "role": "customer-support",
        "allowed_tools": [
          "garden-customer-service.add_customer_service_call",
          "garden-customer-service.resolve_customer_service_call"
        ]
      },
      {
        "role": "human_resource_staffer",
        "allowed_tools": [
          "garden-staff-admin.load_staffers",
          "garden-staff-admin.add_or_update_staffer",
          "garden-staff-admin.get_staffers"
        ]
      },
      {
        "role": "inventory-clerk",
        "allowed_tools": [
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals",
          "garden-online-store.get_supply_orders",
          "garden-online-store.get_customer_orders",
          "garden-online-store.get_product_supply"
        ],
        "allowed_prompts": [
          "garden-business-ops.unavailable_and_unpopular_products"
        ]
      },
      {
        "role": "business-staff",
        "allowed_tools": [
          "garden-business-ops.update_customer_type",
          "garden-online-store.load_customer_orders",
          "garden-online-store.purchase_fulfilled",
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.load_historical_purchases",
          "garden-online-store.add_product_supply",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals"
        ]
      },
      {
        "role": "customer",
        "allowed_tools": [
          "garden-online-store.purchase_products",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_active_deals",
          "garden-customer-admin.get_customer_type"
        ],
        "allowed_prompts": [
          "garden-online-store.product_on_sale_for_me"
        ]
      },
      {
        "role": "customer-*",
        "allowed_tools": [
          "garden-customer-service.get_customer_service_calls"
        ],
        "allowed_prompts": [
          "garden-customer-service.my_service_calls"
        ]
      },
      {
        "role": "business*",
        "allowed_tools": [
          "garden-online-store.get_supply_orders",
          "garden-online-store.get_customer_orders",
          "garden-online-store.get_product_supply"
        ]
      },
      {
        "role": "analyst",
        "allowed_tools": [
          "event-aggregator.list_events",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals",
          "garden-customer-admin.get_customers_status",
          "garden-online-store.get_customer_orders"
        ],
        "allowed_prompts": [
          "garden-business-ops.vip_spend_comparison",
          "garden-business-ops.unhappy_spend_comparison",
          "garden-business-ops.purchase_failure_patterns"
        ]
      }
    ]
  },
  "auth": {
    "audience": "go-proxy",
    "issuer": "http://localhost:8102",
    "jwksUrl": "http://demo-authorization-server.demo-auth.svc.cluster.local:8102/.well-known/jwks.json",
    "publicKeyPath": "",
    "resourceUrl": "http://localhost/mcp",
    "roleClaim": "app_roles"
  },
  "declarativeGuardrails": {
    "actions": [
      "block",
      "alert",
      "log"
    ],
    "declarations": [
      {
        "name": "store-purchase-cost-limit",
        "constraint": "{\"validationTool\": \"validate_store_requests\", \"parameters\": {\"maxTotalCost\": 1000}}",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "store-purchase-cost-warning",
        "constraint": "{\"validationTool\": \"validate_store_requests\", \"parameters\": {\"maxTotalCost\": 700}}",
        "roleExpression": "!admin",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "store-purchase-items-limit",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"items\":{\"type\":\"array\",\"maxItems\":10}}}}}",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "deal-overlap-guard",
        "constraint": "{\"validationTool\": \"validate_deal_requests\", \"parameters\": {}}",
        "roleExpression": "!admin & !business-manager",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "customer-fields-validation",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"id\":{\"type\":\"string\",\"minLength\":1},\"name\":{\"type\":\"string\",\"minLength\":1},\"address\":{\"type\":\"string\",\"minLength\":1},\"phone\":{\"type\":\"string\",\"pattern\":\"^\\\\d{3}-\\\\d{3}-\\\\d{4}$\"},\"type\":{\"type\":\"string\",\"minLength\":1},\"sentiment\":{\"type\":\"string\"}},\"required\":[\"id\",\"name\",\"address\",\"phone\",\"type\"]}},\"required\":[\"arguments\"]}",
        "roleExpression": "!admin & !business-manager & !customer-management",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "customer-deactivation-alert",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"deactivated\":{\"const\":false}}}}}",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "customer-unhappy-alert",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"sentiment\":{\"not\":{\"const\":\"unhappy\"}}}}}}",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "result-no-ssn-disclosure",
        "constraint": "The result must not disclose any customer's Social Security Number or other government ID number.",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "weekend-service-call-alert",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ],
        "effectiveTime": [
          {
            "days": [
              "saturday",
              "sunday"
            ],
            "startTime": "00:00",
            "endTime": "23:59"
          }
        ]
      },
      {
        "name": "service-call-content-required",
        "constraint": "The request's issueText argument must state when the complaint happened, what happened, and what remedy is requested.",
        "roleExpression": "!admin & !customer-support-manager",
        "actions": [
          "block"
        ]
      },
      {
        "name": "staff-handling-guard",
        "constraint": "{\"validationTool\": \"validate_staff_handling\", \"parameters\": {}}",
        "roleExpression": "_any_role",
        "actions": [
          "block"
        ]
      }
    ]
  },
  "discovery": {
    "discoveryMode": "k8s",
    "listedTools": [
      "*"
    ],
    "frequencySeconds": 2,
    "k8sNamespaces": [
      "mcp-proxy",
      "gardening-demo"
    ],
    "k8sPinnedServers": {
      "rate-limiter": "mcp-proxy/rate-limiter",
      "declarative-guardrail": "mcp-proxy/declarative-guardrail",
      "event-aggregator": "mcp-proxy/event-aggregator",
      "ai-powered-tools": "mcp-proxy/ai-powered-tools",
      "garden-business-ops": "gardening-demo/garden-business-ops",
      "garden-customer-admin": "gardening-demo/garden-customer-admin",
      "garden-customer-service": "gardening-demo/garden-customer-service",
      "garden-online-store": "gardening-demo/garden-online-store",
      "garden-staff-admin": "gardening-demo/garden-staff-admin"
    },
    "promptsPollFrequencySeconds": 5,
    "resourceTemplatesPollFrequencySeconds": 5,
    "resourcesPollFrequencySeconds": 5,
    "toolsPollFrequencySeconds": 5
  },
  "eventAggregation": {
    "filter": {},
    "maxBufferSize": 1000,
    "maxLogAgeDays": 5,
    "maxLogSizeBytes": 10000000,
    "archiverTransport": {
      "type": "discard"
    }
  },
  "eventDictionary": {
    "eventTypes": {
      "alert": {
        "metadata": {
          "reason": {
            "required": true,
            "type": "string"
          },
          "roles": {
            "required": true,
            "type": "json"
          },
          "tool": {
            "required": true,
            "type": "string"
          },
          "toolCallId": {
            "required": true,
            "type": "string"
          },
          "user": {
            "required": true,
            "type": "string"
          }
        },
        "subtypes": [
          "tool-call-blocked",
          "result-blocked",
          "tool-call-alert",
          "result-alert"
        ]
      },
      "tool-request": {
        "metadata": {
          "reason": {
            "required": false,
            "type": "string"
          },
          "request": {
            "required": true,
            "type": "json"
          },
          "roles": {
            "required": true,
            "type": "json"
          },
          "tool": {
            "required": true,
            "type": "string"
          },
          "toolCallId": {
            "required": true,
            "type": "string"
          },
          "user": {
            "required": true,
            "type": "string"
          }
        },
        "subtypes": [
          "request-blocked",
          "request-ok"
        ]
      },
      "tool-request-result": {
        "metadata": {
          "reason": {
            "required": false,
            "type": "string"
          },
          "request": {
            "required": true,
            "type": "json"
          },
          "result": {
            "required": false,
            "type": "json"
          },
          "roles": {
            "required": true,
            "type": "json"
          },
          "tool": {
            "required": true,
            "type": "string"
          },
          "toolCallId": {
            "required": true,
            "type": "string"
          },
          "user": {
            "required": true,
            "type": "string"
          }
        },
        "subtypes": [
          "result-blocked",
          "call-failed",
          "call-succeeded"
        ]
      }
    }
  },
  "governanceOrchestration": {
    "orchestrations": {
      "catch-all": {
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "customer-deactivation-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "request_constraints_validation",
            "parameters": "{\"declarationNames\": [\"customer-deactivation-alert\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "customer-details-no-audit": {
        "resultAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "result_ai_constraints_validation",
            "parameters": "{\"declarationNames\": [\"result-no-ssn-disclosure\"]}"
          }
        ]
      },
      "customer-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "request_constraints_validation",
            "parameters": "{\"declarationNames\": [\"customer-fields-validation\", \"customer-unhappy-alert\"]}"
          }
        ]
      },
      "customer-sentiment-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "request_constraints_validation",
            "parameters": "{\"declarationNames\": [\"customer-unhappy-alert\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "deal-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "business_logic_constraints_validation",
            "parameters": "{\"declarationNames\": [\"deal-overlap-guard\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "service-call-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "request_constraints_validation",
            "parameters": "{\"declarationNames\": [\"weekend-service-call-alert\"]}"
          },
          {
            "server": "proxy_utility",
            "tool": "request_ai_constraints_validation",
            "parameters": "{\"declarationNames\": [\"service-call-content-required\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "staffer-deactivation-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "business_logic_constraints_validation",
            "parameters": "{\"declarationNames\": [\"staff-handling-guard\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      },
      "store-purchase-guardrails": {
        "callAuthorization": [
          {
            "server": "proxy_utility",
            "tool": "request_constraints_validation",
            "parameters": "{\"declarationNames\": [\"store-purchase-items-limit\"]}"
          },
          {
            "server": "proxy_utility",
            "tool": "business_logic_constraints_validation",
            "parameters": "{\"declarationNames\": [\"store-purchase-cost-limit\", \"store-purchase-cost-warning\"]}"
          }
        ],
        "toolCallAudit": [
          "publish-tool-request-result"
        ]
      }
    },
    "toolMappings": [
      {
        "pattern": "garden-online-store.purchase_products",
        "orchestration": "store-purchase-guardrails"
      },
      {
        "pattern": "garden-business-ops.add_or_update_deal",
        "orchestration": "deal-guardrails"
      },
      {
        "pattern": "garden-customer-admin.add_or_update_customer",
        "orchestration": "customer-guardrails"
      },
      {
        "pattern": "garden-customer-admin.get_customer_details",
        "orchestration": "customer-details-no-audit"
      },
      {
        "pattern": "garden-customer-admin.mark_customer_deactivated",
        "orchestration": "customer-deactivation-guardrails"
      },
      {
        "pattern": "garden-customer-admin.modify_customer_sentiment",
        "orchestration": "customer-sentiment-guardrails"
      },
      {
        "pattern": "garden-customer-service.add_customer_service_call",
        "orchestration": "service-call-guardrails"
      },
      {
        "pattern": "garden-staff-admin.mark_staffer_deactivated",
        "orchestration": "staffer-deactivation-guardrails"
      },
      {
        "pattern": "garden-customer-admin.load_customers",
        "orchestration": "customer-details-no-audit"
      },
      {
        "pattern": "*",
        "orchestration": "catch-all"
      }
    ]
  },
  "internalAuth": {
    "audience": "go-proxy-backend",
    "issuer": "go-proxy",
    "maxRelayHops": 3,
    "relay": {
      "garden-business-ops": [
        "garden-customer-admin.modify_customer_type"
      ],
      "garden-customer-service": [
        "garden-customer-admin.modify_customer_sentiment"
      ],
      "garden-online-store": [
        "garden-customer-admin.get_customer_type",
        "garden-business-ops.get_active_deals"
      ],
      "garden-staff-admin": [
        "garden-customer-service.get_customer_service_calls"
      ]
    },
    "ttlSeconds": 60
  },
  "natsUrl": "nats://nats:4222",
  "rateLimiting": {},
  "logLevel": {
    "level": "info"
  },
  "selfUrl": "http://go-proxy.mcp-proxy.svc.cluster.local/mcp"
}

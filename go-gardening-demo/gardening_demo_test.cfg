{
  "_comment": "Hermetic test config for the go-gardening-demo servers, mirroring integration_test.cfg's static-discovery pattern - backend ports 9091-9096 are reserved for this file specifically so a future Go integration test exercising all 5 servers together doesn't collide with any existing *_test.go port range in this repo (root package tests currently span roughly :8081-:8115). Port 9093 (formerly garden-inventory, merged into garden-online-store) is intentionally left unused rather than renumbering the rest. selfUrl points at :8081 because that's the proxy's fixed default listen port for both `go run .`/./go-proxy and this repo's own doRunOn - there's no CLI flag to change it, only runProxyServerOn's addr parameter (Go-test-only) can. natsUrl is intentionally omitted, same convention integration_test.cfg/orchestration_test.cfg use - a Go test loading this file is expected to inject natsUrl pointing at an embedded/test NATS instance before starting the proxy (see integration_test.go's writeIntegrationTestConfigWithNatsURL). Verified end-to-end via a real local run: demo-authorization-server + all 5 servers + this config's proxy + the real cli binary, see go-gardening-demo/README.md.",
  "discovery": {
    "discoveryMode": "static",
    "servers": [
      {
        "serverName": "garden-customer-admin",
        "serverUrl": "http://localhost:9091/mcp"
      },
      {
        "serverName": "garden-staff-admin",
        "serverUrl": "http://localhost:9092/mcp"
      },
      {
        "serverName": "garden-customer-service",
        "serverUrl": "http://localhost:9094/mcp"
      },
      {
        "serverName": "garden-business-ops",
        "serverUrl": "http://localhost:9095/mcp"
      },
      {
        "serverName": "garden-online-store",
        "serverUrl": "http://localhost:9096/mcp"
      }
    ]
  },
  "roleMapping": {
    "administrator": "admin"
  },
  "accessRules": {
    "clientAccessRules": [
      {
        "role": "*",
        "allowed_tools": [
          "proxy_utility.find_relevant_tools"
        ],
        "allowed_prompts": [],
        "allowed_resources": [],
        "allowed_resource_templates": []
      },
      {
        "role": "admin",
        "allowed_tools": [
          "*"
        ],
        "allowed_prompts": [
          "*"
        ],
        "allowed_resources": [
          "*"
        ],
        "allowed_resource_templates": [
          "*"
        ]
      },
      {
        "role": "business-manager",
        "allowed_tools": [
          "garden-customer-admin.*",
          "garden-business-ops.*",
          "garden-online-store.load_customer_orders",
          "garden-online-store.purchase_fulfilled",
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.load_historical_purchases",
          "garden-online-store.add_product_supply",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "event-aggregator.list_events"
        ],
        "allowed_prompts": [
          "garden-business-ops.unauthorized_requests_report",
          "garden-business-ops.unavailable_and_unpopular_products"
        ]
      },
      {
        "role": "human_resource_manager",
        "allowed_tools": [
          "garden-staff-admin.*",
          "garden-customer-service.get_customer_service_calls"
        ]
      },
      {
        "role": "customer-support-manager",
        "allowed_tools": [
          "garden-customer-service.*"
        ]
      },
      {
        "role": "customer-management",
        "allowed_tools": [
          "garden-customer-admin.*"
        ]
      },
      {
        "role": "customer-support",
        "allowed_tools": [
          "garden-customer-service.add_customer_service_call",
          "garden-customer-service.resolve_customer_service_call"
        ]
      },
      {
        "role": "human_resource_staffer",
        "allowed_tools": [
          "garden-staff-admin.load_staffers",
          "garden-staff-admin.add_or_update_staffer",
          "garden-staff-admin.get_staffers"
        ]
      },
      {
        "role": "inventory-clerk",
        "allowed_tools": [
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals",
          "garden-online-store.get_supply_orders",
          "garden-online-store.get_customer_orders",
          "garden-online-store.get_product_supply"
        ],
        "allowed_prompts": [
          "garden-business-ops.unavailable_and_unpopular_products"
        ]
      },
      {
        "role": "business-staff",
        "allowed_tools": [
          "garden-business-ops.update_customer_type",
          "garden-online-store.load_customer_orders",
          "garden-online-store.purchase_fulfilled",
          "garden-online-store.load_product_supply",
          "garden-online-store.load_supply_orders",
          "garden-online-store.load_historical_purchases",
          "garden-online-store.add_product_supply",
          "garden-online-store.add_supply_order",
          "garden-online-store.mark_supply_order_fulfilled",
          "garden-online-store.get_inventory",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals"
        ]
      },
      {
        "role": "customer",
        "allowed_tools": [
          "garden-online-store.purchase_products",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_active_deals",
          "garden-customer-admin.get_customer_type"
        ],
        "allowed_prompts": [
          "garden-online-store.product_on_sale_for_me"
        ]
      },
      {
        "role": "customer-*",
        "allowed_tools": [
          "garden-customer-service.get_customer_service_calls"
        ],
        "allowed_prompts": [
          "garden-customer-service.my_service_calls"
        ]
      },
      {
        "role": "business*",
        "allowed_tools": [
          "garden-online-store.get_supply_orders",
          "garden-online-store.get_customer_orders",
          "garden-online-store.get_product_supply"
        ]
      },
      {
        "role": "analyst",
        "allowed_tools": [
          "event-aggregator.list_events",
          "garden-online-store.get_catalogue",
          "garden-business-ops.get_deals",
          "garden-business-ops.get_active_deals",
          "garden-customer-admin.get_customers_status",
          "garden-online-store.get_customer_orders"
        ],
        "allowed_prompts": [
          "garden-business-ops.vip_spend_comparison",
          "garden-business-ops.unhappy_spend_comparison",
          "garden-business-ops.purchase_failure_patterns"
        ]
      }
    ]
  },
  "auth": {
    "publicKeyPath": "",
    "jwksUrl": "http://localhost:8102/.well-known/jwks.json",
    "issuer": "",
    "audience": ""
  },
  "internalAuth": {
    "issuer": "go-proxy",
    "audience": "go-proxy-backend",
    "ttlSeconds": 60,
    "maxRelayHops": 3,
    "relay": {
      "garden-business-ops": ["garden-customer-admin.modify_customer_type"],
      "garden-customer-service": ["garden-customer-admin.modify_customer_sentiment"],
      "garden-online-store": ["garden-customer-admin.get_customer_type", "garden-business-ops.get_active_deals"],
      "garden-staff-admin": ["garden-customer-service.get_customer_service_calls"]
    }
  },
  "selfUrl": "http://localhost:8081/mcp",
  "eventDictionary": {
    "eventTypes": {}
  },
  "declarativeGuardrails": {
    "actions": [
      "block",
      "alert",
      "log"
    ],
    "declarations": [
      {
        "name": "store-purchase-cost-limit",
        "constraint": "{\"validationTool\": \"validate_store_requests\", \"parameters\": {\"maxTotalCost\": 1000}}",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "store-purchase-cost-warning",
        "constraint": "{\"validationTool\": \"validate_store_requests\", \"parameters\": {\"maxTotalCost\": 700}}",
        "roleExpression": "!admin",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "store-purchase-items-limit",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"items\":{\"type\":\"array\",\"maxItems\":10}}}}}",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "deal-overlap-guard",
        "constraint": "{\"validationTool\": \"validate_deal_requests\", \"parameters\": {}}",
        "roleExpression": "!admin & !business-manager",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "customer-fields-validation",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"id\":{\"type\":\"string\",\"minLength\":1},\"name\":{\"type\":\"string\",\"minLength\":1},\"address\":{\"type\":\"string\",\"minLength\":1},\"phone\":{\"type\":\"string\",\"pattern\":\"^\\\\d{3}-\\\\d{3}-\\\\d{4}$\"},\"type\":{\"type\":\"string\",\"minLength\":1},\"sentiment\":{\"type\":\"string\"}},\"required\":[\"id\",\"name\",\"address\",\"phone\",\"type\"]}},\"required\":[\"arguments\"]}",
        "roleExpression": "!admin & !business-manager & !customer-management",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "customer-deactivation-alert",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"deactivated\":{\"const\":false}}}}}",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "customer-unhappy-alert",
        "constraint": "{\"type\":\"object\",\"properties\":{\"arguments\":{\"type\":\"object\",\"properties\":{\"sentiment\":{\"not\":{\"const\":\"unhappy\"}}}}}}",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ]
      },
      {
        "name": "result-no-ssn-disclosure",
        "constraint": "The result must not disclose any customer's Social Security Number or other government ID number.",
        "roleExpression": "!admin",
        "actions": [
          "block",
          "alert"
        ]
      },
      {
        "name": "weekend-service-call-alert",
        "roleExpression": "_any_role",
        "actions": [
          "alert"
        ],
        "effectiveTime": [
          {
            "days": [
              "saturday",
              "sunday"
            ],
            "startTime": "00:00",
            "endTime": "23:59"
          }
        ]
      },
      {
        "name": "service-call-content-required",
        "constraint": "The request's issueText argument must state when the complaint happened, what happened, and what remedy is requested.",
        "roleExpression": "!admin & !customer-support-manager",
        "actions": [
          "block"
        ]
      },
      {
        "name": "staff-handling-guard",
        "constraint": "{\"validationTool\": \"validate_staff_handling\", \"parameters\": {}}",
        "roleExpression": "_any_role",
        "actions": [
          "block"
        ]
      }
    ]
  },
  "eventAggregation": {
    "filter": {},
    "maxBufferSize": 1000,
    "maxLogAgeDays": 5,
    "maxLogSizeBytes": 10000000,
    "archiverTransport": {
      "type": "discard"
    }
  },
  "logLevel": {
    "level": "info"
  }
}

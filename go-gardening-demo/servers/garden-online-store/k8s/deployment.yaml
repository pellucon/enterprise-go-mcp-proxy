apiVersion: apps/v1
kind: Deployment
metadata:
  name: garden-online-store
  labels:
    app: garden-online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garden-online-store
  template:
    metadata:
      labels:
        app: garden-online-store
        mcp.io/role: backend-mcp-server
    spec:
      # Backend MCP servers never need k8s API access; only go-proxy does.
      automountServiceAccountToken: false
      containers:
        - name: garden-online-store
          image: garden-online-store:local
          imagePullPolicy: IfNotPresent
          args:
            - -port=:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
